name: Build
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: swift --version
      - name: Build app (universal)
        run: ./build.sh --universal
      - name: Zip app
        run: |
          cd build
          ditto -c -k --sequesterRsrc --keepParent "MPC Converter.app" ../MPC-Converter.zip
      - uses: actions/upload-artifact@v4
        with:
          name: MPC-Converter
          path: MPC-Converter.zip
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="build-${{ github.run_number }}"
          gh release create "$TAG" MPC-Converter.zip --title "MPC Converter (build ${{ github.run_number }})" --notes "Universal macOS app (Apple Silicon + Intel). Unzip, then right-click → Open the first time." --latest
      - name: Push to dist branch
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          cp MPC-Converter.zip /tmp/MPC-Converter.zip
          git checkout --orphan dist
          git rm -rf . >/dev/null
          cp /tmp/MPC-Converter.zip .
          git add MPC-Converter.zip
          git commit -m "Build ${{ github.run_number }}"
          git push -f origin dist
