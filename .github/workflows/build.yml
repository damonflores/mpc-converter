name: Build
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: swift --version
      - name: Build app (universal)
        run: ./build.sh --universal
      - name: Smoke test (launch app, auto-load a test library)
        continue-on-error: true
        run: |
          mkdir -p logs
          brew install lame >/dev/null 2>&1 || true
          python3 scripts/make_test_library.py "$RUNNER_TEMP/Test Library" > logs/library.txt 2>&1
          rm -f ~/Library/Logs/DiagnosticReports/MPCConverter* || true
          MPC_AUTOLOAD="$RUNNER_TEMP/Test Library" "build/MPC Converter.app/Contents/MacOS/MPCConverter" > logs/app-output.txt 2>&1 &
          PID=$!
          sleep 6;  screencapture -x logs/screen-06s.png || true
          sleep 10; screencapture -x logs/screen-16s.png || true
          sleep 9
          if kill -0 $PID 2>/dev/null; then echo "ALIVE after 25s" > logs/result.txt; kill $PID; else wait $PID; echo "CRASHED exit=$?" > logs/result.txt; fi
          sleep 5
          cp ~/Library/Logs/DiagnosticReports/MPCConverter* logs/ 2>/dev/null || true
          ls -la logs; cat logs/result.txt
      - name: Zip app
        run: |
          cd build
          ditto -c -k --sequesterRsrc --keepParent "MPC Converter.app" ../MPC-Converter.zip
      - uses: actions/upload-artifact@v4
        with:
          name: MPC-Converter
          path: MPC-Converter.zip
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="build-${{ github.run_number }}"
          gh release create "$TAG" MPC-Converter.zip --title "MPC Converter (build ${{ github.run_number }})" --notes "Universal macOS app (Apple Silicon + Intel). Unzip, then right-click → Open the first time." --latest
      - name: Push to dist branch
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          cp MPC-Converter.zip /tmp/MPC-Converter.zip
          cp -R logs /tmp/logs
          git checkout --orphan dist
          git rm -rf . >/dev/null
          cp /tmp/MPC-Converter.zip .
          cp -R /tmp/logs logs
          git add MPC-Converter.zip logs
          git commit -m "Build ${{ github.run_number }}"
          git push -f origin dist
